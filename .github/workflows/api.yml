name: API

on:
  pull_request:
  push:
    branches: [master]

# One production deploy at a time; a newer push to master waits for the one in flight
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint "{src,test}/**/*.ts"
      # Who may do what: roles, own profile, own orders
      - run: npx jest src/core/auth/guards/roles.guard.spec.ts src/users/controllers/users.controller.spec.ts src/orders/controllers/orders.controller.spec.ts src/home/app.controller.spec.ts
      - run: npm run build
      # Only the specs that are written run here; the rest under src/ are still the generated
      # stubs and do not compile their modules, so plain `npm test` stays out of the gate
      - run: npx jest src/core/auth/guards/api-key.guard.spec.ts src/products/services/providers.service.spec.ts src/products/services/products.service.spec.ts src/products/dtos/product.dto.spec.ts src/reports/product-insights.spec.ts src/reports/pdf/report-pdf.spec.ts

  # Stores kept apart, against a real Postgres: every route a user of one store could use to reach
  # another store's data, after running the migrations the deploy runs
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
      API_KEY: ci-only
      JWT_SECRET: ci-only
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrations:run
      - run: npx jest --config test/jest-e2e.json test/stores.e2e-spec.ts test/store-admin.e2e-spec.ts

  deploy:
    needs: [check, isolation]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # An empty secret does not fail on its own: the migrations fall back to the POSTGRES_* values
      # and look for a database on localhost, which a runner does not have
      - name: Check the deploy secrets
        run: |
          missing=0
          for name in DATABASE_URL_UNPOOLED VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name repository secret is missing or empty"
              missing=1
            fi
          done
          exit $missing
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Schema first: the new code may read a column the migration adds
      - name: Run migrations
        run: npm run migrations:run
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          POSTGRES_SSL: 'true'

      - run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
